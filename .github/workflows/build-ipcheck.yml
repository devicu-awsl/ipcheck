name: Auto Build ipcheck.exe

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

permissions: {}

concurrency:
  group: ipcheck-windows-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.package.outputs.version }}
      asset: ${{ steps.package.outputs.asset }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64

      - name: Install the latest PyPI release
        id: package
        run: |
          python -m pip install --upgrade ai-ipcheck packaging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = python -c "from importlib.metadata import version; print(version('ai-ipcheck'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($version -notmatch '^[0-9][0-9A-Za-z.!+_-]*$') {
            throw "Unexpected package version: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "asset=ipcheck v$($version.Replace('!', '-epoch-').Replace('+', '-local-')).exe" >> $env:GITHUB_OUTPUT

      - name: Build and smoke-test the Windows executable
        env:
          VERSION: ${{ steps.package.outputs.version }}
          ASSET: ${{ steps.package.outputs.asset }}
        run: |
          python -m pip install pyinstaller==6.22.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $name = [IO.Path]::GetFileNameWithoutExtension($env:ASSET)
          python -m PyInstaller --onefile --clean --name "$name" --copy-metadata ai-ipcheck --collect-data tzdata run_ipcheck.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = & ".\dist\$env:ASSET" --version
          if ($LASTEXITCODE -ne 0 -or ($result | Out-String).Trim() -ne "ipcheck $env:VERSION") {
            throw "The executable failed its version smoke test. Output: $result"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: ipcheck-windows
          path: dist/${{ steps.package.outputs.asset }}
          if-no-files-found: error
          overwrite: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ipcheck-windows
          path: dist

      - name: Verify and replace the Windows release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          ASSET: ${{ needs.build.outputs.asset }}
        run: |
          [[ "$VERSION" =~ ^[0-9][0-9A-Za-z.!+_-]*$ ]]
          [[ "$ASSET" =~ ^ipcheck\ v[0-9][0-9A-Za-z._-]*\.exe$ ]]
          tag="v$VERSION"
          asset="dist/$ASSET"
          staged="ipcheck-upload.exe"
          local_digest=$(sha256sum "$asset" | cut -d ' ' -f 1)
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          if ! grep -Fxq "$tag" <<< "$releases"; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "ipcheck $tag" --notes "Windows x64 build of ai-ipcheck $VERSION from PyPI." --draft
          fi

          release_api_url=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json apiUrl --jq .apiUrl)
          assets_url="$release_api_url/assets"
          asset_api="repos/$GITHUB_REPOSITORY/releases/assets"
          cp -- "$asset" "dist/$staged"
          gh release upload "$tag" "dist/$staged" --repo "$GITHUB_REPOSITORY" --clobber
          uploaded=$(gh api --paginate "$assets_url" \
            --jq '.[] | select(.state == "uploaded") | [.name, .id, .digest] | @tsv')
          staged_id=$(awk -F '\t' -v name="$staged" -v digest="sha256:$local_digest" \
            '$1 == name && $3 == digest { print $2 }' <<< "$uploaded")
          if [[ ! "$staged_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Uploaded executable SHA-256 did not match the build."
            exit 1
          fi

          previous_ids=$(awk -F '\t' -v name="$ASSET" -v dots="${ASSET/ /.}" -v hyphens="${ASSET/ /-}" \
            '$1 == name || $1 == dots || $1 == hyphens { print $2 }' <<< "$uploaded")
          for id in $previous_ids; do
            gh api --method DELETE "$asset_api/$id" --silent
          done
          gh api --method PATCH "$asset_api/$staged_id" -f "name=$ASSET" -f "label=$ASSET" --silent
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "ipcheck $tag" --draft=false --latest
